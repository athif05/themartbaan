name: Terraform Plan

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Terraform code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 3. Terraform Init
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      # 4. Terraform Format Check
      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: ./terraform

      # 5. Terraform Validate
      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      # 6. Terraform Plan
      - name: Terraform Plan
        run: terraform plan
        working-directory: ./terraform
